[project]
name = "optifi-simulation"
version = "0.1.0"
description = "simulation-engine: ScenarioResult and the mandatory-range guardrail, per SIMULATION_ENGINE_SPEC.md Sections 7/8."
requires-python = ">=3.10"
dependencies = [
    "optifi-shared @ file:///Users/eapple/OptiFi/shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["optifi_simulation*"]
