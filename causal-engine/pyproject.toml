[project]
name = "optifi-causal"
version = "0.1.0"
description = "causal-engine: CausalClaim and the correlation-causation guardrail, per CAUSAL_ENGINE_SPEC.md Section 5."
requires-python = ">=3.10"
dependencies = [
    "optifi-shared @ file:///Users/eapple/OptiFi/shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["optifi_causal*"]
