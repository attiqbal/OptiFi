[project]
name = "optifi-quant"
version = "0.1.0"
description = "quant-engine: portfolio and risk analytics, per QUANT_ENGINE_SPEC.md."
requires-python = ">=3.10"
dependencies = [
    "optifi-shared @ file:///Users/eapple/OptiFi/shared",
    "scipy>=1.10",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["optifi_quant*"]
