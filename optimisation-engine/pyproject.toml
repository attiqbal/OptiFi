[project]
name = "optifi-optimisation"
version = "0.1.0"
description = "optimisation-engine: portfolio allocation solver, per OPTIMISATION_ENGINE_SPEC.md."
requires-python = ">=3.10"
dependencies = [
    "optifi-shared @ file:///Users/eapple/OptiFi/shared",
    "optifi-quant @ file:///Users/eapple/OptiFi/quant-engine",
    "cvxpy>=1.4",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "numpy>=1.24",
    "optifi-verification @ file:///Users/eapple/OptiFi/verification-engine",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["optifi_optimisation*"]
