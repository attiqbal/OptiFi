[project]
name = "optifi-data"
version = "0.1.0"
description = "data-engine: corroboration (ANALYTICAL_CONTRACT_SPEC.md Section 4a) and real-data ingestion (Phase E2)."
requires-python = ">=3.10"
dependencies = [
    "optifi-shared @ file:///Users/eapple/OptiFi/shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["optifi_data*"]

[tool.setuptools.package-data]
optifi_data = ["fixtures/**/*.json", "fixtures/README.md"]
