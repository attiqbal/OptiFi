[project]
name = "optifi-verification"
version = "0.1.0"
description = "verification-engine: independent Stage 11 checks, per VERIFICATION_FRAMEWORK.md."
requires-python = ">=3.10"
dependencies = [
    "optifi-shared @ file:///Users/eapple/OptiFi/shared",
    "optifi-quant @ file:///Users/eapple/OptiFi/quant-engine",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "optifi-ai @ file:///Users/eapple/OptiFi/ai-engine",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["optifi_verification*"]
