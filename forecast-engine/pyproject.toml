[project]
name = "optifi-forecast"
version = "0.1.0"
description = "forecast-engine: forecasting and ensemble/aggregation mechanism, per FORECAST_ENGINE_SPEC.md."
requires-python = ">=3.10"
dependencies = [
    "optifi-shared @ file:///Users/eapple/OptiFi/shared",
    "optifi-evaluation @ file:///Users/eapple/OptiFi/evaluation-engine",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "optifi-data @ file:///Users/eapple/OptiFi/data-engine",
    "optifi-verification @ file:///Users/eapple/OptiFi/verification-engine",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["optifi_forecast*"]
